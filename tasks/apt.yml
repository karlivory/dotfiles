---
##====================================== PREFS ========================================##
#########################################################################################

- name: Set custom apt preferences
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/custom.pref
    content: |
      Explanation: Prevent installation of snapd
      Package: snapd
      Pin: release a=*
      Pin-Priority: -10

      Explanation: Prevent installation of ubuntu-desktop-minimal
      Package: ubuntu-desktop-minimal
      Pin: release a=*
      Pin-Priority: -10

      Explanation: Prevent installation of ubuntu-desktop
      Package: ubuntu-desktop
      Pin: release a=*
      Pin-Priority: -10

      Explanation: Prevent installation of gdm3
      Package: gdm3
      Pin: release a=*
      Pin-Priority: -10

      Explanation: Prefer Firefox packages from Mozilla's APT repository
      Package: firefox*
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000

      Explanation: Prevent Ubuntu's Firefox Snap transition package
      Package: firefox
      Pin: release o=Ubuntu
      Pin-Priority: -1

- name: Add google apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: google
    types: [deb]
    uris:
      - http://dl.google.com/linux/chrome/deb
    signed_by: https://dl.google.com/linux/linux_signing_key.pub
    suites: [stable]
    components: [main]
    state: present
    architectures: amd64
    enabled: yes
  register: google_apt_repository

- name: Add Lens Desktop repository
  become: true
  ansible.builtin.deb822_repository:
    name: lens
    types: [deb]
    uris:
      - https://downloads.k8slens.dev/apt/debian
    signed_by: https://downloads.k8slens.dev/keys/gpg
    suites: [stable]
    components: [main]
    state: present
    architectures: amd64
    enabled: yes
  register: lens_apt_repository

- name: Add Mozilla APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: mozilla
    types: [deb]
    uris:
      - https://packages.mozilla.org/apt
    suites: [mozilla]
    components: [main]
    signed_by: https://packages.mozilla.org/apt/repo-signing-key.gpg
    state: present
    enabled: yes
  register: mozilla_apt_repository

- name: Refresh apt cache after repository changes
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: >-
    google_apt_repository.changed or
    lens_apt_repository.changed or
    mozilla_apt_repository.changed

