---
- name: "Create {{ dotfiles_data_dir }}"
  become: true
  file:
    path: "{{ dotfiles_data_dir }}"
    state: directory
    mode: 0755
    group: root
    owner: root

- name: "Clone luastatus repo"
  become: true
  git:
    repo: https://github.com/shdown/luastatus
    dest: "{{ dotfiles_data_dir }}/luastatus"
    version: 8d88d258d88e5de7f01ec44d72b2dae3982d1d67
    depth: 1
    update: yes
  register: clone_luastatus

- name: Check if luastatus is installed
  ansible.builtin.stat:
    path: /usr/local/bin/luastatus
  register: luastatus_binary

- name: build luastatus
  become: true
  when: clone_luastatus.changed or not luastatus_binary.stat.exists
  command: "cmake ."
  args:
    chdir: "{{ dotfiles_data_dir }}/luastatus"
  changed_when: false

- name: build luastatus
  become: true
  when: clone_luastatus.changed or not luastatus_binary.stat.exists
  command: "make"
  args:
    chdir: "{{ dotfiles_data_dir }}/luastatus"
  changed_when: false

- name: build luastatus
  become: true
  when: clone_luastatus.changed or not luastatus_binary.stat.exists
  command: "make install"
  args:
    chdir: "{{ dotfiles_data_dir }}/luastatus"
  changed_when: false
