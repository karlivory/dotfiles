<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Keep DejaVu as the default text faces. LibreOffice pulls in Noto, which
       60-latin.conf ranks first, changing every site's fallback font. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>UbuntuMono Nerd Font Mono</family>
      <!-- <family>Symbols Nerd Font Mono</family> -->
    </prefer>
  </alias>

  <!-- Ensure UbuntuMono Nerd Font Mono has "Regular" style -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>UbuntuMono Nerd Font Mono</string>
    </test>
    <edit name="style" mode="append">
      <string>Regular</string>
    </edit>
  </match>
</fontconfig>
